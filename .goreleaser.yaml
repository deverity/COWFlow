version: 2

project_name: cowflow

builds:
  - id: cowflow
    main: ./cmd/cowflow
    binary: cowflow
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cowflow
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  # Release notes come from CHANGELOG.md; the GitHub Release links to the full diff.
  disable: true

release:
  draft: false
  prerelease: auto
  footer: |
    **Full diff:** https://github.com/deverity/COWFlow/compare/{{ .PreviousTag }}...{{ .Tag }}
