name: Feature request
description: Propose new behavior or a change to the scope.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: scope-section
    attributes:
      label: Related section of docs/SCOPE.md
      placeholder: "e.g. 9.3 Cross-requests"
