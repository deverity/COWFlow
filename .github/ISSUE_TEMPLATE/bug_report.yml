name: Bug report
description: Something does not work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues must not be reported here.** See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command you ran and the full output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cowflow init ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: COWFlow version
      description: Output of `cowflow version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    id: filesystem
    attributes:
      label: Filesystem / workspace provider
      placeholder: "e.g. Dev Drive (ReFS) + cow_clone, NTFS + git_worktree, btrfs"
  - type: textarea
    id: doctor
    attributes:
      label: "`cowflow doctor` output"
      render: text
